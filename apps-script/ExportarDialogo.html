<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; color: #1e293b; margin: 12px; }
    label { display: block; font-weight: bold; margin: 10px 0 4px; }
    select, input { width: 100%; padding: 6px; box-sizing: border-box; }
    .fila { display: flex; gap: 8px; } .fila > div { flex: 1; }
    button { margin-top: 16px; width: 100%; padding: 9px; background: #22366D; color: #fff;
             border: 0; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; }
    button.sec { margin-top: 8px; background: #fff; color: #22366D; border: 1px solid #22366D; }
    .nota { font-size: 11px; color: #64748b; }
    #msg { margin-top: 12px; font-size: 12px; } .err { color: #b91c1c; } .ok { color: #047857; }
  </style>
</head>
<body>
  <label>Escuela</label>
  <select id="esc"><option>Cargando…</option></select>
  <label>Programa académico</label>
  <select id="prog"></select>
  <div class="fila">
    <div><label>Desde</label><input type="date" id="desde"></div>
    <div><label>Hasta</label><input type="date" id="hasta"></div>
  </div>
  <button id="btn" onclick="exportar()">Exportar resultados (.csv)</button>
  <button id="btn2" class="sec" onclick="plantilla()">Descargar plantilla vacía (.csv)</button>
  <p class="nota">Resultados: cuenta las respuestas del programa en el rango de fechas.<br>
  Plantilla: archivo en ceros para diligenciar a mano (sin usar esta hoja).</p>
  <div id="msg"></div>

<script>
  var opciones = {};
  var $ = function (id) { return document.getElementById(id); };
  $('hasta').value = new Date().toISOString().slice(0, 10);

  google.script.run.withSuccessHandler(function (o) {
    opciones = o;
    $('esc').innerHTML = Object.keys(o).map(function (e) { return '<option>' + e + '</option>'; }).join('');
    cargarProgramas();
  }).withFailureHandler(error).obtenerOpciones();

  $('esc').onchange = cargarProgramas;
  function cargarProgramas() {
    var p = opciones[$('esc').value] || [];
    $('prog').innerHTML = p.map(function (x) { return '<option>' + x + '</option>'; }).join('');
  }

  function ocupado(b) { $('btn').disabled = b; $('btn2').disabled = b; }
  function descargar(r) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8' }));
    a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove();
  }
  function exportar() {
    ocupado(true); $('msg').className = ''; $('msg').textContent = 'Generando…';
    google.script.run.withSuccessHandler(function (r) {
      ocupado(false); $('msg').className = 'ok';
      $('msg').innerHTML = '✓ ' + r.resumen + '<br>Guardado en Drive: <a href="' + r.url + '" target="_blank">' + r.nombre + '</a>';
      descargar(r);
    }).withFailureHandler(error).exportarCSV($('esc').value, $('prog').value, $('desde').value, $('hasta').value);
  }
  function plantilla() {
    ocupado(true); $('msg').className = ''; $('msg').textContent = 'Generando plantilla…';
    google.script.run.withSuccessHandler(function (r) {
      ocupado(false); $('msg').className = 'ok'; $('msg').textContent = '✓ Plantilla: ' + r.resumen;
      descargar(r);
    }).withFailureHandler(error).plantillaCSV($('esc').value, $('prog').value, $('desde').value, $('hasta').value);
  }
  function error(e) { ocupado(false); $('msg').className = 'err'; $('msg').textContent = e.message || e; }
</script>
</body>
</html>
